<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="pattern">
    <test name="prgname" compare="eq"><string>quickshell</string></test>
    <test name="family" compare="eq"><string>monospace</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="prgname" compare="eq"><string>qs</string></test>
    <test name="family" compare="eq"><string>monospace</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Inter</string></edit>
  </match>
</fontconfig>
